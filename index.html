<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Concept Bản Đồ Lái Xe</title>
    <!-- Nhúng thư viện Bản đồ Maplibre miễn phí -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #alert-box {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(255, 0, 0, 0.9); color: white; padding: 15px;
            font-size: 18px; font-weight: bold; border-radius: 8px;
            display: none; text-align: center; z-index: 999;
        }
    </style>
</head>
<body>

<div id="alert-box">⚠️ CẢNH BÁO: <span id="alert-text"></span></div>
<div id="map"></div>

<script>
// 1. Khởi tạo bản đồ nền miễn phí (Dùng style công cộng của OpenStreetMap)
  // Khởi tạo Bản đồ Vector
  const map = new maplibregl.Map({
      container: 'map',
      // SỬA CHUẨN: Sử dụng style từ OpenFreeMap Bright
      style: 'https://tiles.openfreemap.org/styles/bright',
      // SỬA CHUẨN: Gọi tới Style Vector do MapTiler Server tự cấp (Không cần internet)
      //style: 'http://macbook-pro-ng-display:8078/styles/basic-preview/style.json',
      center: [105.8542, 21.0285], // Tọa độ trung tâm Hà Nội
      zoom: 13,
      pitch: 60,
      bearing: 0
  });

// Marker hiển thị vị trí hiện tại của xe (chấm xanh)
const userMarkerEl = document.createElement('div');
userMarkerEl.style.width = '18px';
userMarkerEl.style.height = '18px';
userMarkerEl.style.borderRadius = '50%';
userMarkerEl.style.background = '#1a73e8';
userMarkerEl.style.border = '3px solid white';
userMarkerEl.style.boxShadow = '0 0 6px rgba(0,0,0,0.5)';

const userMarker = new maplibregl.Marker({ element: userMarkerEl })
    .setLngLat([105.8542, 21.0285])
    .addTo(map);

// 2. Dữ liệu các nút giao cần cảnh báo (Copy từ Bước 1 vào đây)
const junctionsData = {
    "type": "FeatureCollection",
    "features": [
        {
            "type": "Feature",
            "properties": { "name": "Điểm Test Gần Nhà", "message": "Nút giao nguy hiểm, chú ý giảm tốc độ!", "radius": 50 },
            "geometry": { "type": "Point", "coordinates": [105.805365, 21.064760] } // SỬA TỌA ĐỘ CỦA BẠN Ở ĐÂY
        }
    ]
};

// Hàm tính khoảng cách giữa 2 tọa độ (mét)
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// Hàm bắt điện thoại đọc thành tiếng
function speakMessage(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        window.speechSynthesis.speak(utterance);
    }
}

// Danh sách để đánh dấu xem nút giao nào đã cảnh báo rồi, tránh đọc lặp đi lặp lại
let alertedJunctions = {};

// 3. Bật định vị GPS thời gian thực trên điện thoại
if (navigator.geolocation) {
    navigator.geolocation.watchPosition((position) => {
        const userLat = position.coords.latitude;
        const userLon = position.coords.longitude;

        map.setCenter([userLon, userLat]);
        userMarker.setLngLat([userLon, userLat]);

        let hasAlert = false;

        junctionsData.features.forEach(junction => {
            const jLon = junction.geometry.coordinates[0];
            const jLat = junction.geometry.coordinates[1];
            const distance = calculateDistance(userLat, userLon, jLat, jLon);

            if (distance <= junction.properties.radius) {
                hasAlert = true;
                document.getElementById('alert-text').innerText = junction.properties.message;
                document.getElementById('alert-box').style.display = 'block';

                if (!alertedJunctions[junction.properties.name]) {
                    speakMessage(junction.properties.message);
                    alertedJunctions[junction.properties.name] = true;
                }
            }
        });

        if (!hasAlert) {
            document.getElementById('alert-box').style.display = 'none';
            alertedJunctions = {};
        }

    }, (error) => {
        console.error("Lỗi lấy GPS: ", error);
        alert("Không lấy được vị trí GPS: " + error.message);
    }, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 5000
    });
} else {
    alert("Điện thoại của bạn không hỗ trợ định vị GPS.");
}
</script>
</body>
</html>
