<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Concept Bản Đồ Lái Xe</title>
    <!-- Nhúng thư viện Bản đồ Maplibre miễn phí -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #alert-box {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(255, 0, 0, 0.9); color: white; padding: 15px;
            font-size: 18px; font-weight: bold; border-radius: 8px;
            display: none; text-align: center; z-index: 999;
        }
        #control-panel {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.95); padding: 12px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.2); z-index: 999;
            font-family: sans-serif; font-size: 14px;
        }
        #control-panel .row { display: flex; gap: 6px; margin-bottom: 8px; }
        #control-panel input {
            flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
            font-size: 14px; min-width: 0;
        }
        #control-panel button {
            padding: 8px 12px; border: none; border-radius: 6px;
            background: #1a73e8; color: white; font-size: 14px; white-space: nowrap;
        }
        #control-panel button.secondary { background: #34a853; }
        #status-text { font-size: 12px; color: #555; margin-top: 4px; }
    </style>
</head>
<body>

<div id="alert-box">⚠️ CẢNH BÁO: <span id="alert-text"></span></div>
<div id="map"></div>

<div id="control-panel">
    <div class="row">
        <input id="input-paste" type="text" placeholder="Dán tọa độ từ Google Maps (vd: 21.0035, 105.8194)" style="flex:1">
    </div>
    <div class="row">
        <input id="input-lat" type="number" step="any" placeholder="Vĩ độ (lat)" value="21.0035">
        <input id="input-lng" type="number" step="any" placeholder="Kinh độ (lng)" value="105.8194">
    </div>
    <div class="row">
        <button id="btn-update" style="flex:1">📍 Cập nhật điểm cảnh báo</button>
        <button id="btn-test-audio" class="secondary" style="flex:1">🔊 Test âm thanh</button>
    </div>
    <div id="status-text">Chưa có vị trí GPS</div>
</div>

<script>
// 1. Khởi tạo bản đồ nền miễn phí (Dùng style công cộng của OpenStreetMap)
  // Khởi tạo Bản đồ Vector
  const map = new maplibregl.Map({
      container: 'map',
      // SỬA CHUẨN: Sử dụng style từ OpenFreeMap Bright
      style: 'https://tiles.openfreemap.org/styles/bright',
      // SỬA CHUẨN: Gọi tới Style Vector do MapTiler Server tự cấp (Không cần internet)
      //style: 'http://macbook-pro-ng-display:8078/styles/basic-preview/style.json',
      center: [105.8542, 21.0285], // Tọa độ trung tâm Hà Nội
      zoom: 13,
      pitch: 60,
      bearing: 0
  });

// Marker hiển thị vị trí hiện tại của xe (chấm xanh)
const userMarkerEl = document.createElement('div');
userMarkerEl.style.width = '18px';
userMarkerEl.style.height = '18px';
userMarkerEl.style.borderRadius = '50%';
userMarkerEl.style.background = '#1a73e8';
userMarkerEl.style.border = '3px solid white';
userMarkerEl.style.boxShadow = '0 0 6px rgba(0,0,0,0.5)';

const userMarker = new maplibregl.Marker({ element: userMarkerEl })
    .setLngLat([105.8542, 21.0285])
    .addTo(map);

// 2. Dữ liệu các nút giao cần cảnh báo (Copy từ Bước 1 vào đây)
const junctionsData = {
    "type": "FeatureCollection",
    "features": [
        {
            "type": "Feature",
            "properties": { "name": "Điểm Test Gần Nhà", "message": "Nút giao nguy hiểm, chú ý giảm tốc độ!", "radius": 50 },
            "geometry": { "type": "Point", "coordinates": [105.8194, 21.0035] } // SỬA TỌA ĐỘ CỦA BẠN Ở ĐÂY
        }
    ]
};

// Marker hiển thị điểm cảnh báo (chấm đỏ) — đồng bộ với junctionsData
const junctionMarkerEl = document.createElement('div');
junctionMarkerEl.style.width = '16px';
junctionMarkerEl.style.height = '16px';
junctionMarkerEl.style.borderRadius = '50%';
junctionMarkerEl.style.background = '#ea4335';
junctionMarkerEl.style.border = '3px solid white';
junctionMarkerEl.style.boxShadow = '0 0 6px rgba(0,0,0,0.5)';

const firstCoords = junctionsData.features[0].geometry.coordinates;
const junctionMarker = new maplibregl.Marker({ element: junctionMarkerEl })
    .setLngLat(firstCoords)
    .addTo(map);

// Hàm tính khoảng cách giữa 2 tọa độ (mét)
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
}

// Hàm bắt điện thoại đọc thành tiếng
function speakMessage(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        window.speechSynthesis.speak(utterance);
    }
}

// Danh sách để đánh dấu xem nút giao nào đã cảnh báo rồi, tránh đọc lặp đi lặp lại
let alertedJunctions = {};

// 3. Bật định vị GPS thời gian thực trên điện thoại
// Dán tọa độ nguyên cụm "lat, lng" copy từ Google Maps -> tự tách vào 2 ô lat/lng
// (tránh nhầm thứ tự trục khi gõ tay)
document.getElementById('input-paste').addEventListener('input', (e) => {
    const parts = e.target.value.split(',').map(s => parseFloat(s.trim()));
    if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        document.getElementById('input-lat').value = parts[0]; // Google Maps: lat trước
        document.getElementById('input-lng').value = parts[1]; // lng sau
    }
});

// 4. Bảng điều khiển: cập nhật điểm cảnh báo bằng tay + test âm thanh
document.getElementById('btn-update').addEventListener('click', () => {
    const lat = parseFloat(document.getElementById('input-lat').value);
    const lng = parseFloat(document.getElementById('input-lng').value);
    if (isNaN(lat) || isNaN(lng)) {
        alert('Tọa độ không hợp lệ.');
        return;
    }
    junctionsData.features[0].geometry.coordinates = [lng, lat];
    junctionMarker.setLngLat([lng, lat]);
    map.setCenter([lng, lat]);
    alertedJunctions = {}; // reset để có thể cảnh báo lại điểm mới
    document.getElementById('status-text').innerText = `Đã cập nhật điểm cảnh báo: ${lat}, ${lng}`;
});

// Nút test âm thanh: bấm tay để "mở khóa" quyền phát giọng nói của trình duyệt di động
// (speechSynthesis thường bị chặn nếu không gọi từ một cú chạm của người dùng)
document.getElementById('btn-test-audio').addEventListener('click', () => {
    speakMessage('Đã bật âm thanh thành công');
});

if (navigator.geolocation) {
    navigator.geolocation.watchPosition((position) => {
        const userLat = position.coords.latitude;
        const userLon = position.coords.longitude;

        document.getElementById('status-text').innerText =
            `Vị trí hiện tại: ${userLat.toFixed(5)}, ${userLon.toFixed(5)}`;

        map.setCenter([userLon, userLat]);
        userMarker.setLngLat([userLon, userLat]);

        let hasAlert = false;

        junctionsData.features.forEach(junction => {
            const jLon = junction.geometry.coordinates[0];
            const jLat = junction.geometry.coordinates[1];
            const distance = calculateDistance(userLat, userLon, jLat, jLon);

            if (distance <= junction.properties.radius) {
                hasAlert = true;
                document.getElementById('alert-text').innerText = junction.properties.message;
                document.getElementById('alert-box').style.display = 'block';

                if (!alertedJunctions[junction.properties.name]) {
                    speakMessage(junction.properties.message);
                    alertedJunctions[junction.properties.name] = true;
                }
            }
        });

        if (!hasAlert) {
            document.getElementById('alert-box').style.display = 'none';
            alertedJunctions = {};
        }

    }, (error) => {
        console.error("Lỗi lấy GPS: ", error);
        alert("Không lấy được vị trí GPS: " + error.message);
    }, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 5000
    });
} else {
    alert("Điện thoại của bạn không hỗ trợ định vị GPS.");
}
</script>
</body>
</html>
